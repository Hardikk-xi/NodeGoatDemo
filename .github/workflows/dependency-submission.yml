name: Dependency Check Scan

on:
  push:
  pull_request:

jobs:
  sca-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Java (required)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Install prerequisites
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      # Step 4: Download Dependency-Check (stable version)
      - name: Download Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip -O dc.zip

      # Step 5: Extract tool
      - name: Extract Dependency-Check
        run: unzip dc.zip

      # Cache the Dependency-Check DB directory between runs
      - name: Cache Dependency-Check DB
        id: dc-cache
        uses: actions/cache@v4
        with:
          # This folder is the --data location we will pass to dependency-check
          path: dependency-check-data
          key: dependency-check-db-${{ runner.os }}-v9-0-9
          restore-keys: |
            dependency-check-db-${{ runner.os }}-v9-

      # Only initialize DB when cache miss
      - name: Initialize Dependency-Check DB (cache miss only)
        if: steps.dc-cache.outputs.cache-hit != 'true'
        run: |
          # Ensure scripts are executable
          chmod +x ./dependency-check/bin/*.sh
          # Run update-only to create the DB into the project-local folder
          ./dependency-check/bin/dependency-check.sh --update-only --data ./dependency-check-data

      # Run scan using the cached/initialized DB and prevent live updates
      - name: Run Dependency-Check
        run: |
          chmod +x ./dependency-check/bin/*.sh
          mkdir -p ./reports
          ./dependency-check/bin/dependency-check.sh \
            --project "GitHub SCA Scan" \
            --scan . \
            --format HTML \
            --out ./reports \
            --data ./dependency-check-data \
            --noupdate

      # Upload report
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html
