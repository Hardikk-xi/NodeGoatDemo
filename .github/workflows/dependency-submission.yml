name: Dependency Check Scan

on:
  push:
  pull_request:

jobs:
  sca-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ FIX: Ensure unzip exists
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      # ✅ FIX: Download properly
      - name: Download Dependency-Check
        run: wget -O dc.zip https://github.com/jeremylong/DependencyCheck/releases/latest/download/dependency-check.zip

      # ✅ FIX: Extract properly
      - name: Extract Dependency-Check
        run: unzip dc.zip

      # ✅ RUN SCAN
      - name: Run Dependency-Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
          --project "GitHub SCA Scan" \
          --scan . \
          --format HTML \
          --out .

      # ✅ Upload report (v4 correct)
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html
