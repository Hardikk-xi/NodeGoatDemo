name: Dependency Check Scan

on:
  push:
  pull_request:

jobs:
  sca-scan:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # ✅ Install Java (Dependency-Check requires Java)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Download and extract Dependency-Check
      - name: Install Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/latest/download/dependency-check.zip
          unzip dependency-check.zip

      # ✅ Run SCA scan
      - name: Run Dependency-Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
          --project "GitHub SCA Scan" \
          --scan . \
          --format HTML \
          --out .

      # ✅ Upload report (UPDATED TO v4 ✅)
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html
