name: Dependency Check Scan

on:
  push:
  pull_request:

jobs:
  sca-scan:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # ✅ Step 2: Setup Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Step 3: Install tools
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      # ✅ Step 4: Download Dependency-Check
      - name: Download Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip -O dc.zip

      # ✅ Step 5: Extract tool
      - name: Extract Dependency-Check
        run: unzip dc.zip

      # ✅ Step 6: Initial DB Setup (FIRST RUN ONLY ✅)
      - name: Initialize Database
        run: |
          chmod +x ./dependency-check/bin/*.sh
          ./dependency-check/bin/dependency-check.sh \
            --project "DB Init" \
            --scan . \
            --format "HTML" \
            --out ./init-report

      # ✅ Step 7: Actual Scan (NO UPDATE ✅)
      - name: Run Dependency-Check
        run: |
          chmod +x ./dependency-check/bin/*.sh
          mkdir -p ./reports
          ./dependency-check/bin/dependency-check.sh \
            --project "GitHub SCA Scan" \
            --scan . \
            --format "HTML" \
            --out ./reports \
           

      # ✅ Step 8: Upload report
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html
``
